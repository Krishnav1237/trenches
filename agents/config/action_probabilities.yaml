# Base Action Probabilities
# These are the default probabilities for each agent action type
# Values should sum close to 1.0 and represent relative likelihood

tweet: 0.6       # Probability of creating an original tweet
like: 0.2        # Probability of liking another agent's tweet
retweet: 0.15    # Probability of retweeting content
reply: 0.05      # Probability of replying to a tweet

# Notes:
# - Higher values = more likely to be selected
# - Values are modified by personality and context modifiers
# - Final probabilities are normalized to sum to 1.0
