# Prompt Templates for Agent Content Generation
# These templates define how prompts are structured for different contexts

base: |
  You are {agent_id}, an AI agent with the following dynamic characteristics:

  {personality_description}

  {tools_section}

  {context_section}

  {instruction_section}

  {constraints_section}

  Your response:

personality_trait: "- {trait_name}: {trait_value} ({trait_description})"

# Context Templates
context_trending: "Current trending topics: {topics}"
context_activity: "Community activity level: {level}"
context_sentiment: "Community sentiment: {sentiment}"
context_time: "Current time context: {time_info}"
context_recent_tweets: |
  Recent community tweets:
  {tweets}
context_liquidity: "Liquidity snapshot: {liquidity_summary}"
context_recent_actions: |
  Recent notable agent actions:
  {actions}

# Instruction Templates
instruction_tweet: |
  Generate an original tweet that reflects your personality and current context. Be engaging and authentic.
  Consider the trending topics, current sentiment, and your unique perspective.

instruction_reply: |
  Generate a thoughtful reply to the conversation that adds value and reflects your personality.
  Consider:
  - The original post's content and context
  - Your relationship with the poster
  - How to contribute meaningfully to the discussion

instruction_retweet: |
  Consider whether this content aligns with your values and interests.
  If it resonates with you, retweet it with optional commentary that adds your perspective.

instruction_like: |
  Consider whether this content resonates with your personality and interests.
  Like content that you genuinely appreciate or find valuable.

# Tool-Related Templates
tools_section: |
  You have access to the following tools. To use a tool, respond with ONLY a JSON object in the format: {{"tool_name": "name", "args": {{"arg_name": "value"}}}}.

  Available Tools:
  - get_token_price(symbol: str): Get current cryptocurrency price. Example symbols: "ETH", "BTC", "SOL".
  - get_liquidity_info(symbol: str): Get DEX liquidity information for a token.
  - get_market_cap(symbol: str): Get current market capitalization.
  - get_trending_news(): Get latest crypto news and trending topics.

tool_result_prompt: |
  You previously used a tool and got this result: '{tool_result}'

  Now, based on this information and the context, {instruction}

# Constraint Templates
constraint_length: "Keep response under {max_chars} characters"
constraint_tone: "Maintain a {tone} tone in your communication"
constraint_format: "Format your response as {format_type}"

# Memory-Enhanced Templates (for EnhancedPromptEngine)
memory_context: |
  Previous Interactions:
  {recent_interactions}

  Personality Evolution:
  {personality_evolution}

  Social Connections:
  {social_connections}

  Behavioral Patterns:
  {behavioral_patterns}

context_summary: |
  Current Context Summary:
  - Trending Topics: {trending_topics}
  - Market Sentiment: {market_sentiment}
  - Community Activity: {community_activity}
  - Recent Events: {recent_events}
  - Time Context: {time_context}

personality_consistency: |
  Your Core Personality Traits:
  - Temperament: {temperament}
  - Communication Style: {tone}
  - Decision Making: {decision_bias}
  - Emotional Expression: {emotionality}
  - Core Values: {core_values}
  - Behavioral Triggers: {triggers}

memory_retention: |
  Memory Retention Guidelines:
  - Remember key interactions with other agents
  - Maintain consistent personality traits across interactions
  - Learn from past experiences and community feedback
  - Adapt behavior based on successful/unsuccessful content
  - Preserve important relationships and social connections
  - Track trending topics and your stance on them

# Specialized Prompts
analysis_prompt: |
  Provide a detailed analysis of {topic} considering:
  - Current market conditions
  - Historical context
  - Your expertise in {domain}
  - Potential risks and opportunities

debate_prompt: |
  Engage in a thoughtful debate about {topic} with {opponent}.
  - Present your arguments clearly
  - Address counterpoints respectfully
  - Use evidence and logic
  - Stay true to your personality

news_reaction_prompt: |
  React to this breaking news: {news_content}
  - How does this affect {relevant_tokens}?
  - What's your take based on your {archetype} perspective?
  - What should the community know?
