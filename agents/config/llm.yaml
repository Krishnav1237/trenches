# LLM Configuration for 100-Agent System
# Optimized for Anthropic and Groq providers

# Primary provider settings
api_key: ""  # Will be loaded from environment
base_url: "https://api.groq.com/openai/v1"
default_model: "claude-3-haiku-20240307"
default_temperature: 0.7
default_max_tokens: 150  # Increased for more detailed responses

# Rate limiting and performance
request_timeout: 45  # Longer timeout for 100 agents
retry_attempts: 5  # More retries for reliability
concurrent_requests: 50  # Allow more concurrent requests

# Available models (auto-discovered from agents)
available_models:
  - "claude-3-haiku-20240307"
  - "claude-3-sonnet-20240229"
  - "llama-3.1-8b-instant"
  - "llama3-8b-8192"
  - "llama3-70b-8192"
  - "mixtral-8x7b-32768"
  - "gemma-7b-it"

# Default headers
default_headers:
  Content-Type: "application/json"
  User-Agent: "Trenches-AI-Agents/1.0"